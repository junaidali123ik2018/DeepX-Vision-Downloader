<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DeepX Vision Downloader</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <img src="icons/icon32.png" alt="Logo" class="logo">
            <div class="title-wrap">
                <span class="brand">DeepX Vision</span>
                <span class="subtitle">IDM Video Assistant</span>
            </div>
            <span class="status-badge" id="appStatus">Connecting…</span>
        </div>

        <div class="current-page">
            <span class="page-title" id="pageTitle">Current Webpage</span>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="btnDownloadVideo">
                <span>⚡ Download Video (Full HD / 4K)</span>
            </button>
            <button class="btn btn-secondary" id="btnDownloadAudio">
                <span>🎵 Download Audio (MP3)</span>
            </button>
        </div>

        <div class="media-section">
            <div class="section-label">Detected Streams:</div>
            <div class="media-list" id="mediaList">
                <div class="empty-state">Looking for media streams…</div>
            </div>
        </div>

        <div class="footer">
            <button class="btn-link" id="btnOpenApp">⚡ Open DeepX Vision App</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
